<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#102a43" />
  <title>Kairon's Magic Fruit Hunt</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f2236; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { touch-action: none; }
    #gameWrap { position: relative; width: 100%; height: 100%; min-height: 260px; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; inset: 0 0 auto 0; display: flex; justify-content: center; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 10px 0; pointer-events: none;
    }
    .pill { background: rgba(8,33,50,.75); color: white; border: 2px solid rgba(255,255,255,.72); border-radius: 999px; padding: 7px 12px; font-weight: 800; font-size: clamp(13px,2.2vw,18px); text-shadow: 0 1px 2px #0007; backdrop-filter: blur(4px); }
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(7,25,40,.18); }
    #panel { width: min(560px, 92vw); text-align: center; color: white; background: rgba(11,40,62,.88); border: 3px solid rgba(255,255,255,.78); border-radius: 28px; padding: clamp(18px,4vw,34px); box-shadow: 0 20px 60px #0005; }
    #title { margin: 0 0 10px; font-size: clamp(28px,7vw,52px); line-height: .95; letter-spacing: -.02em; }
    #subtitle { margin: 0 auto 18px; max-width: 40ch; font-size: clamp(15px,2.7vw,20px); opacity: .95; }
    #playBtn { appearance: none; border: 0; border-radius: 999px; padding: 14px 28px; font-size: clamp(18px,3vw,24px); font-weight: 900; background: #ffd54a; color: #18334a; box-shadow: 0 7px 0 #d89f00; cursor: pointer; min-width: 150px; }
    #playBtn:active { transform: translateY(4px); box-shadow: 0 3px 0 #d89f00; }
    #hint { margin-top: 14px; font-size: clamp(12px,2vw,15px); opacity: .85; }
    .hidden { display: none !important; }
  </style>
  <script src="https://www.youtube.com/game_api/v1"></script>
</head>
<body>
  <div id="gameWrap" aria-label="Kairon's Magic Fruit Hunt game">
    <canvas id="game" aria-label="Game area"></canvas>
    <div id="hud" class="hidden" aria-live="polite">
      <div class="pill" id="fruitHud">Fruit 0/12</div>
      <div class="pill" id="eggHud">Eggs 0/3</div>
      <div class="pill" id="scoreHud">Score 0</div>
    </div>
    <div id="overlay">
      <div id="panel">
        <h1 id="title">Kairon's Magic Fruit Hunt</h1>
        <p id="subtitle">Help Kairon collect 12 fruits and open 3 magical eggs!</p>
        <button id="playBtn" type="button">PLAY</button>
        <div id="hint">Tap, drag, click, or use arrow keys.</div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const playBtn = document.getElementById('playBtn');
  const hud = document.getElementById('hud');
  const fruitHud = document.getElementById('fruitHud');
  const eggHud = document.getElementById('eggHud');
  const scoreHud = document.getElementById('scoreHud');

  let W = 1280, H = 720, DPR = 1;
  let last = performance.now();
  let running = false;
  let paused = false;
  let loadedSave = false;
  let audioEnabled = true;
  let audioCtx = null;
  let pointerDown = false;
  let target = null;
  const keys = new Set();

  const state = {
    fruits: 0,
    eggs: 0,
    score: 0,
    best: 0,
    nextEggAt: 4,
    sparkles: [],
    popups: [],
    fruit: null,
    egg: null,
    eggAnim: 0,
    eggReward: null,
    completed: false,
    elapsed: 0,
  };

  const kairon = { x: 640, y: 480, r: 42, speed: 420, bob: 0 };
  const fruitTypes = ['apple','orange','pear','strawberry','grapes','banana'];

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function playableEnv(){ return typeof ytgame !== 'undefined' && !!ytgame.IN_PLAYABLES_ENV; }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, window.innerWidth);
    H = Math.max(260, window.innerHeight);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    kairon.x = clamp(kairon.x, 48, W-48);
    kairon.y = clamp(kairon.y, 96, H-52);
    if (state.fruit) { state.fruit.x = clamp(state.fruit.x, 45, W-45); state.fruit.y = clamp(state.fruit.y, 120, H-52); }
    if (state.egg) { state.egg.x = clamp(state.egg.x, 55, W-55); state.egg.y = clamp(state.egg.y, 135, H-62); }
  }
  window.addEventListener('resize', resize);
  resize();

  function trySdkCall(fn){ try { return fn(); } catch (_) { return undefined; } }

  async function loadSave(){
    let data = null;
    try {
      if (playableEnv()) {
        const raw = await ytgame.game.loadData();
        if (raw) data = JSON.parse(raw);
      } else {
        const raw = localStorage.getItem('kaironFruitHuntSave');
        if (raw) data = JSON.parse(raw);
      }
    } catch (_) {}
    if (data && Number.isFinite(data.best)) state.best = Math.max(0, Math.floor(data.best));
    loadedSave = true;
  }

  async function saveBest(){
    if (!loadedSave) return;
    const raw = JSON.stringify({ version: 1, best: state.best });
    try {
      if (playableEnv()) await ytgame.game.saveData(raw);
      else localStorage.setItem('kaironFruitHuntSave', raw);
    } catch (_) {}
  }

  async function sendBestScore(){
    if (!playableEnv()) return;
    try { await ytgame.engagement.sendScore({ value: state.best }); } catch (_) {}
  }

  function setupYoutubeHooks(){
    if (typeof ytgame === 'undefined') return;
    try {
      audioEnabled = ytgame.system.isAudioEnabled();
      ytgame.system.onAudioEnabledChange(v => { audioEnabled = !!v; });
      ytgame.system.onPause(() => { paused = true; saveBest(); });
      ytgame.system.onResume(() => { paused = false; last = performance.now(); });
    } catch (_) {}
  }

  function ensureAudio(){
    if (!audioEnabled) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function tone(freq=600, duration=.08, type='sine', gain=.06){
    if (!audioEnabled) return;
    const ac = ensureAudio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(gain, ac.currentTime + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + duration + .02);
  }

  function chirp(){ tone(720,.07,'sine',.05); setTimeout(()=>tone(980,.1,'sine',.05),55); }
  function eggChime(){ [520,660,820].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.055),i*70)); }

  function safePoint(pad=65){
    const top = 120, bottom = H - pad;
    for(let i=0;i<30;i++){
      const p = { x: rand(pad,W-pad), y: rand(top,Math.max(top+1,bottom)) };
      if (dist(p,kairon)>140 && (!state.egg || dist(p,state.egg)>120)) return p;
    }
    return {x: W*.7, y:H*.45};
  }

  function spawnFruit(){
    const p = safePoint(55);
    state.fruit = { ...p, r: 25, type: fruitTypes[Math.floor(Math.random()*fruitTypes.length)], pulse: rand(0,6.28) };
  }

  function spawnEgg(){
    const p = safePoint(70);
    state.egg = { ...p, r: 37, pulse: 0 };
    state.eggAnim = 0;
    state.eggReward = null;
  }

  function addSparkles(x,y,n=16){
    for(let i=0;i<n;i++){
      const a = rand(0,Math.PI*2), s=rand(55,210);
      state.sparkles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:rand(.45,.9),max:1,size:rand(2,6)});
    }
  }

  function popup(text,x,y){ state.popups.push({text,x,y,life:1}); }

  function resetGame(){
    state.fruits=0; state.eggs=0; state.score=0; state.nextEggAt=4; state.sparkles=[]; state.popups=[];
    state.fruit=null; state.egg=null; state.eggAnim=0; state.eggReward=null; state.completed=false; state.elapsed=0;
    kairon.x=W*.5; kairon.y=H*.68; target=null;
    spawnFruit();
    updateHud();
  }

  function startGame(){
    ensureAudio();
    resetGame();
    overlay.classList.add('hidden'); hud.classList.remove('hidden');
    running=true; paused=false; last=performance.now();
  }

  async function finishGame(){
    running=false; state.completed=true;
    if (state.score > state.best) state.best = state.score;
    await saveBest();
    await sendBestScore();
    hud.classList.add('hidden'); overlay.classList.remove('hidden');
    titleEl.textContent = 'You did it!';
    subtitleEl.textContent = `12 fruits, 3 magical eggs, and ${state.score} points! Best: ${state.best}`;
    playBtn.textContent = 'PLAY AGAIN';
    chirp(); setTimeout(eggChime,100);
  }

  function updateHud(){
    fruitHud.textContent=`Fruit ${state.fruits}/12`;
    eggHud.textContent=`Eggs ${state.eggs}/3`;
    scoreHud.textContent=`Score ${state.score}`;
  }

  function collectFruit(){
    const f=state.fruit; if(!f) return;
    state.fruits++; state.score+=10; addSparkles(f.x,f.y,12); popup('+10',f.x,f.y-12); chirp(); state.fruit=null;
    if(state.fruits >= state.nextEggAt && state.eggs < 3 && !state.egg){ spawnEgg(); state.nextEggAt += 4; }
    if(state.fruits < 12) setTimeout(()=>{ if(running && !state.fruit) spawnFruit(); },160);
    updateHud();
    checkComplete();
  }

  function openEgg(){
    if(!state.egg || state.eggAnim>0) return;
    state.eggAnim=.001; state.eggs++; state.score+=50; state.eggReward=['STAR','RAINBOW','GEM'][Math.floor(Math.random()*3)];
    addSparkles(state.egg.x,state.egg.y,28); popup('+50',state.egg.x,state.egg.y-34); eggChime(); updateHud();
    setTimeout(()=>{ state.egg=null; state.eggAnim=0; state.eggReward=null; checkComplete(); },700);
  }

  function checkComplete(){ if(state.fruits>=12 && state.eggs>=3) setTimeout(()=>{ if(running) finishGame(); },500); }

  function pointerPos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
  }
  canvas.addEventListener('pointerdown',e=>{ pointerDown=true; target=pointerPos(e); ensureAudio(); try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
  canvas.addEventListener('pointermove',e=>{ if(pointerDown) target=pointerPos(e); });
  canvas.addEventListener('pointerup',()=>{ pointerDown=false; });
  canvas.addEventListener('pointercancel',()=>{ pointerDown=false; });
  window.addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)) keys.add(e.key.toLowerCase()); });
  window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

  function move(dt){
    let dx=0,dy=0;
    if(keys.has('arrowleft')||keys.has('a')) dx--;
    if(keys.has('arrowright')||keys.has('d')) dx++;
    if(keys.has('arrowup')||keys.has('w')) dy--;
    if(keys.has('arrowdown')||keys.has('s')) dy++;
    if(dx||dy){ const m=Math.hypot(dx,dy)||1; kairon.x+=dx/m*kairon.speed*dt; kairon.y+=dy/m*kairon.speed*dt; target=null; }
    else if(target){ const vx=target.x-kairon.x, vy=target.y-kairon.y, d=Math.hypot(vx,vy); if(d>5){ const step=Math.min(d,kairon.speed*dt); kairon.x+=vx/d*step; kairon.y+=vy/d*step; } }
    kairon.x=clamp(kairon.x,45,W-45); kairon.y=clamp(kairon.y,100,H-48);
    kairon.bob += dt*6;
  }

  function update(dt){
    if(!running||paused) return;
    state.elapsed+=dt; move(dt);
    if(state.fruit){ state.fruit.pulse+=dt*4; if(dist(kairon,state.fruit)<kairon.r+state.fruit.r*.78) collectFruit(); }
    if(state.egg){ state.egg.pulse+=dt*3; if(dist(kairon,state.egg)<kairon.r+state.egg.r*.78) openEgg(); if(state.eggAnim>0) state.eggAnim+=dt; }
    for(const s of state.sparkles){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=260*dt; s.life-=dt; }
    state.sparkles=state.sparkles.filter(s=>s.life>0);
    for(const p of state.popups){ p.y-=42*dt; p.life-=dt; }
    state.popups=state.popups.filter(p=>p.life>0);
  }

  function roundRect(x,y,w,h,r,fill,stroke,lw=2){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}
  }

  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#65c9ff'); g.addColorStop(.58,'#b9edff'); g.addColorStop(.59,'#78d465'); g.addColorStop(1,'#3caa59'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,245,170,.92)'; ctx.beginPath(); ctx.arc(W*.82,H*.17,Math.min(W,H)*.07,0,Math.PI*2); ctx.fill();
    // distant hills
    ctx.fillStyle='#63bd69'; ctx.beginPath(); ctx.moveTo(0,H*.64); for(let x=0;x<=W;x+=80){ctx.lineTo(x,H*.58+Math.sin(x*.009)*25);} ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    ctx.fillStyle='#49a955'; ctx.beginPath(); ctx.moveTo(0,H*.72); for(let x=0;x<=W;x+=70){ctx.lineTo(x,H*.68+Math.sin(x*.012+2)*20);} ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    // flowers
    for(let i=0;i<18;i++){ const x=(i*83+37)%W, y=H*.74+((i*47)%Math.max(30,H*.23)); ctx.fillStyle=i%2?'#fff4a7':'#f7c8ff'; ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill(); }
  }

  function drawFruit(f){
    if(!f) return; const s=1+Math.sin(f.pulse)*.07; ctx.save();ctx.translate(f.x,f.y);ctx.scale(s,s);ctx.lineWidth=3;ctx.strokeStyle='#ffffffaa';
    if(f.type==='apple'){
      ctx.fillStyle='#ef4455';ctx.beginPath();ctx.arc(-9,3,16,0,Math.PI*2);ctx.arc(9,3,16,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#5b3d24';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(4,-24);ctx.stroke();ctx.fillStyle='#4caf50';ctx.beginPath();ctx.ellipse(11,-18,10,5,-.4,0,Math.PI*2);ctx.fill();
    } else if(f.type==='orange'){
      ctx.fillStyle='#ff9f1c';ctx.beginPath();ctx.arc(0,3,21,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#4caf50';ctx.beginPath();ctx.ellipse(3,-19,10,4,0,0,Math.PI*2);ctx.fill();
    } else if(f.type==='pear'){
      ctx.fillStyle='#9acb42';ctx.beginPath();ctx.arc(0,8,19,0,Math.PI*2);ctx.arc(0,-8,12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#5b3d24';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(4,-28);ctx.stroke();
    } else if(f.type==='strawberry'){
      ctx.fillStyle='#f23f59';ctx.beginPath();ctx.moveTo(-20,-7);ctx.quadraticCurveTo(0,31,20,-7);ctx.quadraticCurveTo(0,-21,-20,-7);ctx.fill();ctx.stroke();ctx.fillStyle='#4fb85a';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(i*9,-12,9,4,i*.35,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='#ffe27a';for(const [x,y] of [[-8,0],[7,-2],[-3,10],[8,9]]){ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();}
    } else if(f.type==='grapes'){
      ctx.fillStyle='#8057d8'; for(const [x,y] of [[-9,-7],[6,-7],[-15,7],[0,6],[15,7],[-7,19],[8,19],[0,30]]){ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.stroke();} ctx.fillStyle='#4caf50';ctx.beginPath();ctx.ellipse(4,-22,13,5,-.3,0,Math.PI*2);ctx.fill();
    } else {
      ctx.strokeStyle='#ffe14a';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.arc(-3,-3,24,-.4,1.8);ctx.stroke();ctx.strokeStyle='#fff9ae';ctx.lineWidth=3;ctx.stroke();ctx.lineCap='butt';
    }
    ctx.restore();
  }

  function drawEgg(e){
    if(!e) return; const pulse=1+Math.sin(e.pulse)*.04; ctx.save();ctx.translate(e.x,e.y);ctx.scale(pulse,pulse);
    let open=Math.min(1,state.eggAnim*2.3);
    ctx.fillStyle='#ffd54f';ctx.strokeStyle='#fff6c6';ctx.lineWidth=4;
    if(open<.35){ ctx.beginPath();ctx.ellipse(0,2,29,39,0,0,Math.PI*2);ctx.fill();ctx.stroke(); }
    else {
      ctx.save();ctx.translate(0,open*-16);ctx.beginPath();ctx.ellipse(0,-12,28,18,0,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
      ctx.save();ctx.translate(0,open*12);ctx.beginPath();ctx.ellipse(0,11,29,25,0,0,Math.PI);ctx.fill();ctx.stroke();ctx.restore();
    }
    ctx.fillStyle='#35b9e8'; for(const [x,y,r] of [[-9,-3,6],[10,7,5],[4,-20,4]]){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
    if(open>.4){ ctx.globalAlpha=open; drawStar(0,0,12,'#ffffff'); }
    ctx.restore();
  }

  function drawStar(x,y,r,color){
    ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2===0?r:r*.45; const px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();
  }

  function drawKairon(){
    const bob=Math.sin(kairon.bob)*2.5; ctx.save();ctx.translate(kairon.x,kairon.y+bob);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,45,35,10,0,0,Math.PI*2);ctx.fill();
    // legs
    ctx.strokeStyle='#eaf7ff';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-15,25);ctx.lineTo(-18,43);ctx.moveTo(15,25);ctx.lineTo(18,43);ctx.stroke();
    ctx.strokeStyle='#1da9e6';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-23,45);ctx.lineTo(-11,45);ctx.moveTo(11,45);ctx.lineTo(23,45);ctx.stroke();
    // body
    roundRect(-31,-18,62,54,18,'#f6fbff','#1aa7e1',4);
    roundRect(-25,-12,50,42,14,'#ffffff',null);
    ctx.fillStyle='#1aa7e1';ctx.fillRect(-29,11,58,8);
    drawStar(0,5,12,'#ffd84d');
    // arms
    ctx.strokeStyle='#edf9ff';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-31,-2);ctx.lineTo(-43,15);ctx.moveTo(31,-2);ctx.lineTo(43,15);ctx.stroke();
    ctx.fillStyle='#1aa7e1';ctx.beginPath();ctx.arc(-44,17,7,0,Math.PI*2);ctx.arc(44,17,7,0,Math.PI*2);ctx.fill();
    // head
    roundRect(-37,-61,74,48,19,'#f7fcff','#1aa7e1',4);
    ctx.fillStyle='#173b57';ctx.beginPath();ctx.ellipse(-14,-37,8,10,0,0,Math.PI*2);ctx.ellipse(14,-37,8,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5ee7ff';ctx.beginPath();ctx.arc(-14,-39,4,0,Math.PI*2);ctx.arc(14,-39,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1aa7e1';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-61);ctx.lineTo(0,-75);ctx.stroke();ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(0,-80,7,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawEffects(){
    for(const s of state.sparkles){ ctx.globalAlpha=Math.max(0,s.life/.9); drawStar(s.x,s.y,s.size,'#fff5a8'); }
    ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.font='900 24px system-ui';ctx.fillStyle='white';ctx.strokeStyle='#173b57';ctx.lineWidth=5;
    for(const p of state.popups){ ctx.globalAlpha=Math.max(0,p.life);ctx.strokeText(p.text,p.x,p.y);ctx.fillText(p.text,p.x,p.y); }
    ctx.globalAlpha=1;
  }

  function draw(){ drawBackground(); if(state.fruit) drawFruit(state.fruit); if(state.egg) drawEgg(state.egg); drawKairon(); drawEffects(); }

  function loop(now){
    const dt=Math.min(.04,(now-last)/1000||0);last=now; update(dt); draw(); requestAnimationFrame(loop);
  }

  playBtn.addEventListener('click', startGame);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){paused=true;saveBest();} else {paused=false;last=performance.now();} });

  async function boot(){
    draw();
    trySdkCall(()=>ytgame.game.firstFrameReady());
    setupYoutubeHooks();
    await loadSave();
    subtitleEl.textContent = state.best > 0
      ? `Help Kairon collect 12 fruits and open 3 magical eggs! Best: ${state.best}`
      : 'Help Kairon collect 12 fruits and open 3 magical eggs!';
    trySdkCall(()=>ytgame.game.gameReady());
    requestAnimationFrame(loop);
  }
  boot();
})();
</script>
