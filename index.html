  <title>Kairon's Magic Fruit Hunt - Sound Fix</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f2236; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { touch-action: none; }
    #gameWrap { position: relative; width: 100%; height: 100%; min-height: 260px; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; inset: 0 0 auto 0; display: flex; justify-content: center; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 10px 0; pointer-events: none;
    }
    .pill { background: linear-gradient(180deg,rgba(31,112,181,.92),rgba(19,73,132,.94)); color: white; border: 2px solid rgba(255,255,255,.88); border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: clamp(13px,2.2vw,18px); text-shadow: 0 2px 2px #00365e88; backdrop-filter: blur(5px); box-shadow: 0 4px 0 rgba(6,57,103,.45),0 8px 18px #06446a22; }
    #overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(7,25,40,.18); }
    #panel { width: min(560px, 92vw); text-align: center; color: white; background: linear-gradient(180deg,rgba(23,108,177,.92),rgba(24,73,130,.93)); border: 3px solid rgba(255,255,255,.9); border-radius: 30px; padding: clamp(18px,4vw,34px); box-shadow: 0 12px 0 rgba(8,63,109,.38),0 26px 60px #184b6f44; }
    #title { margin: 0 0 10px; font-size: clamp(28px,7vw,52px); line-height: .95; letter-spacing: -.02em; }
    #subtitle { margin: 0 auto 18px; max-width: 40ch; font-size: clamp(15px,2.7vw,20px); opacity: .95; }
    #playBtn { appearance: none; border: 3px solid #fff7b9; border-radius: 999px; padding: 14px 30px; font-size: clamp(18px,3vw,24px); font-weight: 1000; background: linear-gradient(#ffe873,#ffc928); color: #124d79; box-shadow: 0 7px 0 #d99800,0 12px 24px #163f5d44; cursor: pointer; min-width: 150px; }
    #playBtn:active { transform: translateY(4px); box-shadow: 0 3px 0 #d89f00; }
    #hint { margin-top: 14px; font-size: clamp(12px,2vw,15px); opacity: .85; }
    #friendlyDisclaimer {
      margin: 12px auto 0;
      max-width: 38ch;
      font-size: clamp(11px,1.8vw,14px);
      line-height: 1.35;
      opacity: .78;
    }
    .hidden { display: none !important; }
  </style>

  const kaironFrames = {
    walking: { sx:0, sy:0, sw:160, sh:220 },
    jumping: { sx:160, sy:0, sw:160, sh:220 },
    waving: { sx:320, sy:0, sw:160, sh:220 }
  };

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function playableEnv(){ return typeof ytgame !== 'undefined' && !!ytgame.IN_PLAYABLES_ENV; }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, window.innerWidth);
    H = Math.max(260, window.innerHeight);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    kairon.x = clamp(kairon.x, 48, W-48);
    kairon.y = clamp(kairon.y, 96, H-52);
    if (state.fruit) { state.fruit.x = clamp(state.fruit.x, 45, W-45); state.fruit.y = clamp(state.fruit.y, 120, H-52); }
    if (state.egg) { state.egg.x = clamp(state.egg.x, 55, W-55); state.egg.y = clamp(state.egg.y, 135, H-62); }
  }
  window.addEventListener('resize', resize);
  resize();

  function trySdkCall(fn){ try { return fn(); } catch (_) { return undefined; } }

  async function loadSave(){
    let data = null;
    try {
      if (playableEnv()) {
        const raw = await ytgame.game.loadData();
        if (raw) data = JSON.parse(raw);
      } else {
        const raw = localStorage.getItem('kaironFruitHuntSave');
        if (raw) data = JSON.parse(raw);
      }
    } catch (_) {}
    if (data && Number.isFinite(data.best)) state.best = Math.max(0, Math.floor(data.best));
    loadedSave = true;
  }

  async function saveBest(){
    if (!loadedSave) return;
    const raw = JSON.stringify({ version: 1, best: state.best });
    try {
      if (playableEnv()) await ytgame.game.saveData(raw);
      else localStorage.setItem('kaironFruitHuntSave', raw);
    } catch (_) {}
  }

  async function sendBestScore(){
    if (!playableEnv()) return;
    try { await ytgame.engagement.sendScore({ value: state.best }); } catch (_) {}
  }

  function playMusic(){
    if (!audioEnabled || !bgMusic) return;
    bgMusic.play().catch(()=>{});
  }

  function pauseMusic(){
    if (bgMusic) bgMusic.pause();
  }

  function restartMusic(){
    if (!bgMusic) return;
    try { bgMusic.currentTime = 0; } catch (_) {}
    playMusic();
  }

  function setupYoutubeHooks(){
    // On a normal web page (including GitHub Pages), the YouTube SDK script may
    // exist even though we are NOT inside Playables. In that case it must not
    // control or mute the game's audio.
    if (!playableEnv()) {
      audioEnabled = true;
      return;
    }

    try {
      audioEnabled = ytgame.system.isAudioEnabled();
      ytgame.system.onAudioEnabledChange(v => {
        audioEnabled = !!v;
        if (audioEnabled && running && !paused) playMusic();
        else pauseMusic();
      });
      ytgame.system.onPause(() => { paused = true; pauseMusic(); saveBest(); });
      ytgame.system.onResume(() => { paused = false; last = performance.now(); if (running) playMusic(); });
    } catch (_) {
      audioEnabled = true;
    }
  }

  function ensureAudio(){
    if (!audioEnabled) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function tone(freq=600, duration=.08, type='sine', gain=.06){
    if (!audioEnabled) return;
    const ac = ensureAudio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(gain, ac.currentTime + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + duration + .02);
  }

  function chirp(){ tone(720,.07,'sine',.05); setTimeout(()=>tone(980,.1,'sine',.05),55); }
  function eggChime(){ [520,660,820].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.055),i*70)); }

  function safePoint(pad=65){
    const top = 120, bottom = H - pad;
    for(let i=0;i<30;i++){
      const p = { x: rand(pad,W-pad), y: rand(top,Math.max(top+1,bottom)) };
      if (dist(p,kairon)>140 && (!state.egg || dist(p,state.egg)>120)) return p;
    }
    return {x: W*.7, y:H*.45};
  }

  function spawnFruit(){
    const p = safePoint(55);
    state.fruit = { ...p, r: 25, type: fruitTypes[Math.floor(Math.random()*fruitTypes.length)], pulse: rand(0,6.28) };
  }

  function spawnEgg(){
    const p = safePoint(70);
    state.egg = { ...p, r: 37, pulse: 0 };
    state.eggAnim = 0;
    state.eggReward = null;
  }

  function addSparkles(x,y,n=16){
    for(let i=0;i<n;i++){
      const a = rand(0,Math.PI*2), s=rand(55,210);
      state.sparkles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-70,life:rand(.45,.9),max:1,size:rand(2,6)});
    }
  }

  function popup(text,x,y){ state.popups.push({text,x,y,life:1}); }

  function resetGame(){
    state.fruits=0; state.eggs=0; state.score=0; state.nextEggAt=4; state.sparkles=[]; state.popups=[];
    state.fruit=null; state.egg=null; state.eggAnim=0; state.eggReward=null; state.completed=false; state.elapsed=0;
    kairon.x=W*.5; kairon.y=H*.68; kairon.facing=1; kairon.moving=false; kairon.celebrate=0; target=null;
    spawnFruit();
    updateHud();
  }

  function startGame(){
    // PLAY is a real user gesture, so start the music here.
    running = true;
    paused = false;
    last = performance.now();
    audioEnabled = playableEnv() ? audioEnabled : true;

    ensureAudio();
    if (bgMusic) {
      bgMusic.muted = false;
      bgMusic.volume = 0.20;
    }
    restartMusic();

    if (friendlyDisclaimer) friendlyDisclaimer.classList.add('hidden');
    resetGame();
    overlay.classList.add('hidden');
    hud.classList.remove('hidden');
  }

  async function finishGame(){
    running=false; state.completed=true;
    pauseMusic();
    if (state.score > state.best) state.best = state.score;
    await saveBest();
    await sendBestScore();
    hud.classList.add('hidden'); overlay.classList.remove('hidden');
    titleEl.textContent = 'You did it!';
    subtitleEl.textContent = `12 fruits, 3 magical eggs, and ${state.score} points! Best: ${state.best}`;
    playBtn.textContent = 'PLAY AGAIN';
    chirp(); setTimeout(eggChime,100);
  }

  function updateHud(){
    fruitHud.textContent=`Fruit ${state.fruits}/12`;
    eggHud.textContent=`Eggs ${state.eggs}/3`;
    scoreHud.textContent=`Score ${state.score}`;
  }

  function collectFruit(){
    const f=state.fruit; if(!f) return;
    state.fruits++; state.score+=10; addSparkles(f.x,f.y,12); popup('+10',f.x,f.y-12); chirp(); state.fruit=null;
    if(state.fruits >= state.nextEggAt && state.eggs < 3 && !state.egg){ spawnEgg(); state.nextEggAt += 4; }
    if(state.fruits < 12) setTimeout(()=>{ if(running && !state.fruit) spawnFruit(); },160);
    updateHud();
    checkComplete();
  }

  function openEgg(){
    if(!state.egg || state.eggAnim>0) return;
    state.eggAnim=.001; state.eggs++; state.score+=50; kairon.celebrate=.62; state.eggReward=['STAR','RAINBOW','GEM'][Math.floor(Math.random()*3)];
    addSparkles(state.egg.x,state.egg.y,28); popup('+50',state.egg.x,state.egg.y-34); eggChime(); updateHud();
    setTimeout(()=>{ state.egg=null; state.eggAnim=0; state.eggReward=null; checkComplete(); },700);
  }

  function checkComplete(){ if(state.fruits>=12 && state.eggs>=3) setTimeout(()=>{ if(running) finishGame(); },500); }

  function pointerPos(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
  }
  canvas.addEventListener('pointerdown',e=>{ pointerDown=true; target=pointerPos(e); ensureAudio(); try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
  canvas.addEventListener('pointermove',e=>{ if(pointerDown) target=pointerPos(e); });
  canvas.addEventListener('pointerup',()=>{ pointerDown=false; });
  canvas.addEventListener('pointercancel',()=>{ pointerDown=false; });

  window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

  function move(dt){
    let dx=0,dy=0;

    if(keys.has('arrowright')||keys.has('d')) dx++;
    if(keys.has('arrowup')||keys.has('w')) dy--;

        kairon.moving=true;
      } else target=null;
    }
    kairon.x=clamp(kairon.x,45,W-45); kairon.y=clamp(kairon.y,100,H-48);
    kairon.bob += dt*(kairon.moving?9:4);
  }

  function update(dt){
    if(!running||paused) return;
    state.elapsed+=dt; if(kairon.celebrate>0) kairon.celebrate=Math.max(0,kairon.celebrate-dt); move(dt);
    if(state.fruit){ state.fruit.pulse+=dt*4; if(dist(kairon,state.fruit)<kairon.r+state.fruit.r*.78) collectFruit(); }
    if(state.egg){ state.egg.pulse+=dt*3; if(dist(kairon,state.egg)<kairon.r+state.egg.r*.78) openEgg(); if(state.eggAnim>0) state.eggAnim+=dt; }
    for(const s of state.sparkles){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=260*dt; s.life-=dt; }
    state.sparkles=state.sparkles.filter(s=>s.life>0);
    for(const p of state.popups){ p.y-=42*dt; p.life-=dt; }
    state.popups=state.popups.filter(p=>p.life>0);
  }

  function roundRect(x,y,w,h,r,fill,stroke,lw=2){
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}
  }

  function drawCloud(x,y,s,alpha=.96){
    ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(x,y,s*.27,0,Math.PI*2);
    ctx.arc(x+s*.26,y-s*.09,s*.34,0,Math.PI*2);
    ctx.arc(x+s*.58,y,s*.25,0,Math.PI*2);
    ctx.arc(x+s*.28,y+s*.10,s*.38,0,Math.PI*2);
    ctx.fill(); ctx.restore();
  }

  function drawFlower(x,y,s,c){
    ctx.strokeStyle='#287a45';ctx.lineWidth=Math.max(1,s*.11);ctx.beginPath();ctx.moveTo(x,y+s*.8);ctx.lineTo(x,y);ctx.stroke();
    ctx.fillStyle=c;
    for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;ctx.beginPath();ctx.arc(x+Math.cos(a)*s*.30,y+Math.sin(a)*s*.30,s*.22,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#ffd84c';ctx.beginPath();ctx.arc(x,y,s*.18,0,Math.PI*2);ctx.fill();
  }

  function drawBackground(){
    // bright storybook sky
    const sky=ctx.createLinearGradient(0,0,0,H*.68);
    sky.addColorStop(0,'#57c8ff'); sky.addColorStop(.55,'#9fe6ff'); sky.addColorStop(1,'#e8fbff');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

    // soft sun glow
    const sunX=W*.82,sunY=H*.16,sunR=Math.min(W,H)*.062;
    const sg=ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,sunR*2.2);
    sg.addColorStop(0,'rgba(255,244,128,1)');sg.addColorStop(.48,'rgba(255,234,92,.95)');sg.addColorStop(1,'rgba(255,234,92,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sunX,sunY,sunR*2.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe96b';ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();

    // tiny decorative stars/sparkles in the sky
    for(let i=0;i<11;i++){
      const x=(i*137+73)%W, y=55+((i*61)%Math.max(70,H*.34));
      ctx.globalAlpha=.18+(i%3)*.08; drawStar(x,y,3+(i%2)*1.4,'#ffffff');
    }
    ctx.globalAlpha=1;

    // fluffy clouds
    drawCloud(W*.09,H*.16,95,.88); drawCloud(W*.39,H*.11,72,.76); drawCloud(W*.65,H*.27,60,.62); drawCloud(W*.90,H*.31,76,.70);

    // distant candy-coloured mountains
    ctx.fillStyle='#9bb8e9';ctx.beginPath();ctx.moveTo(0,H*.57);
    ctx.lineTo(W*.13,H*.39);ctx.lineTo(W*.24,H*.56);ctx.lineTo(W*.37,H*.35);ctx.lineTo(W*.51,H*.57);ctx.lineTo(W*.66,H*.42);ctx.lineTo(W*.79,H*.58);ctx.lineTo(W,H*.43);ctx.lineTo(W,H*.70);ctx.lineTo(0,H*.70);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d7e6ff';
    for(const [x,y,r] of [[W*.13,H*.39,32],[W*.37,H*.35,38],[W*.66,H*.42,27],[W,H*.43,35]]){ctx.beginPath();ctx.moveTo(x-r,y+r*.65);ctx.lineTo(x,y);ctx.lineTo(x+r,y+r*.65);ctx.lineTo(x+r*.34,y+r*.48);ctx.lineTo(x,y+r*.28);ctx.lineTo(x-r*.25,y+r*.48);ctx.closePath();ctx.fill();}

    // rolling hills with more depth
    ctx.fillStyle='#7cdb72';ctx.beginPath();ctx.moveTo(0,H*.60);ctx.bezierCurveTo(W*.18,H*.51,W*.26,H*.62,W*.42,H*.56);ctx.bezierCurveTo(W*.57,H*.49,W*.68,H*.61,W*.83,H*.54);ctx.bezierCurveTo(W*.91,H*.51,W*.96,H*.53,W,H*.55);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
    ctx.fillStyle='#52c767';ctx.beginPath();ctx.moveTo(0,H*.69);ctx.bezierCurveTo(W*.18,H*.58,W*.35,H*.67,W*.50,H*.61);ctx.bezierCurveTo(W*.69,H*.53,W*.79,H*.70,W,H*.61);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

    // little fence on horizon
    ctx.save();ctx.globalAlpha=.75;ctx.strokeStyle='#fff7df';ctx.lineWidth=5;ctx.lineCap='round';
    const fy=H*.625;ctx.beginPath();ctx.moveTo(W*.06,fy);ctx.lineTo(W*.28,fy-7);ctx.stroke();
    for(let i=0;i<7;i++){const x=W*.06+i*W*.036;ctx.beginPath();ctx.moveTo(x,fy+9);ctx.lineTo(x,fy-20);ctx.stroke();}
    ctx.restore();


    // foreground meadow gradient
    const meadow=ctx.createLinearGradient(0,H*.69,0,H);
    meadow.addColorStop(0,'rgba(65,184,91,.10)');meadow.addColorStop(1,'rgba(28,137,73,.28)');ctx.fillStyle=meadow;ctx.fillRect(0,H*.69,W,H*.31);

    // warm winding path, visually breaks up the green slab
    ctx.fillStyle='#ffe0a2';ctx.beginPath();ctx.moveTo(W*.46,H);ctx.bezierCurveTo(W*.42,H*.88,W*.55,H*.80,W*.50,H*.68);ctx.bezierCurveTo(W*.48,H*.64,W*.50,H*.61,W*.51,H*.585);ctx.lineTo(W*.545,H*.585);ctx.bezierCurveTo(W*.54,H*.63,W*.57,H*.68,W*.58,H*.73);ctx.bezierCurveTo(W*.61,H*.84,W*.57,H*.92,W*.62,H);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(217,165,85,.28)';ctx.lineWidth=3;ctx.stroke();

    // sparse ground detail, kept low so collectibles remain the visual priority
    const colors=['#ff72b8','#fff18a','#b99cff','#ffffff','#ff8b6b'];
    for(let i=0;i<10;i++){
      const x=(i*97+41)%W, y=H*.73+((i*53)%Math.max(25,H*.24));
      if(x>W*.42&&x<W*.63&&y>H*.78) continue;
      drawFlower(x,y,4+(i%3),colors[i%colors.length]);
    }
    for(let i=0;i<8;i++){
      const x=(i*173+105)%W, y=H*.78+((i*71)%Math.max(20,H*.17));
      ctx.fillStyle='#d7eff0';ctx.beginPath();ctx.ellipse(x,y,7+i%3*2,4+i%2,0,0,Math.PI*2);ctx.fill();
    }
  }

  function drawFruit(f){
    if(!f) return;

    const s = 1 + Math.sin(f.pulse) * .055;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(s, s);

    // Soft shadow keeps the collectible readable without making it look like a sticker.
    ctx.fillStyle = 'rgba(20,55,45,.18)';
    ctx.beginPath();
    ctx.ellipse(1, 25, 22, 6, 0, 0, Math.PI*2);
    ctx.fill();

    const outline = '#ffffff';
    const outlineSoft = 'rgba(255,255,255,.96)';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    function glossySpot(x,y,rx,ry,alpha=.65,rot=-.45){
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function leaf(x,y,rx,ry,rot){
      const g = ctx.createLinearGradient(x-rx,y-ry,x+rx,y+ry);
      g.addColorStop(0,'#75d25d');
      g.addColorStop(1,'#2f9d4f');
      ctx.fillStyle=g;
      ctx.strokeStyle=outlineSoft;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    if(f.type === 'apple'){
      // One continuous apple silhouette: no overlapping-circle seams.
      const g = ctx.createRadialGradient(-7,-9,3,3,5,29);
      g.addColorStop(0,'#ff7782');
      g.addColorStop(.55,'#f14458');
      g.addColorStop(1,'#c92842');
      ctx.fillStyle = g;
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(0,-13);
      ctx.bezierCurveTo(-6,-20,-22,-18,-25,-4);
      ctx.bezierCurveTo(-29,12,-17,27,0,29);
      ctx.bezierCurveTo(17,27,29,12,25,-4);
      ctx.bezierCurveTo(22,-18,6,-20,0,-13);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.strokeStyle='#71462a'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(0,-13); ctx.quadraticCurveTo(1,-22,6,-28); ctx.stroke();
      leaf(11,-22,10,5,-.45);
      glossySpot(-10,-7,5,8,.55);

    } else if(f.type === 'orange'){
      const g = ctx.createRadialGradient(-8,-10,2,3,4,28);
      g.addColorStop(0,'#ffd15c');
      g.addColorStop(.42,'#ffa52e');
      g.addColorStop(1,'#ee7319');
      ctx.fillStyle=g;
      ctx.strokeStyle=outline;
      ctx.lineWidth=3.2;
      ctx.beginPath(); ctx.arc(0,2,23,0,Math.PI*2); ctx.fill(); ctx.stroke();

      // Tiny peel texture, deliberately subtle.
      ctx.fillStyle='rgba(180,90,20,.22)';
      for(const [x,y] of [[8,9],[-7,13],[12,-2],[-13,3],[2,17]]){
        ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
      }
      leaf(5,-20,10,4.5,-.15);
      glossySpot(-9,-9,5,7,.5);

    } else if(f.type === 'pear'){
      const g = ctx.createRadialGradient(-7,-7,2,2,6,31);
      g.addColorStop(0,'#d8ef72');
      g.addColorStop(.52,'#a9d84f');
      g.addColorStop(1,'#75ad37');
      ctx.fillStyle=g;
      ctx.strokeStyle=outline;
      ctx.lineWidth=3.2;
      ctx.beginPath();
      ctx.moveTo(0,-21);
      ctx.bezierCurveTo(-4,-17,-8,-12,-9,-5);
      ctx.bezierCurveTo(-10,1,-24,8,-23,18);
      ctx.bezierCurveTo(-22,30,-10,35,0,35);
      ctx.bezierCurveTo(10,35,22,30,23,18);
      ctx.bezierCurveTo(24,8,10,1,9,-5);
      ctx.bezierCurveTo(8,-12,4,-17,0,-21);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.strokeStyle='#74502f'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(1,-27,5,-31); ctx.stroke();
      leaf(10,-25,9,4,-.35);
      glossySpot(-8,3,4.5,8,.45);

    } else if(f.type === 'strawberry'){
      const g = ctx.createLinearGradient(-14,-12,16,28);
      g.addColorStop(0,'#ff7180');
      g.addColorStop(.55,'#ef3854');
      g.addColorStop(1,'#c91f41');
      ctx.fillStyle=g;
      ctx.strokeStyle=outline;
      ctx.lineWidth=3.2;
      ctx.beginPath();
      ctx.moveTo(-22,-7);
      ctx.bezierCurveTo(-21,-19,-8,-20,0,-14);
      ctx.bezierCurveTo(8,-20,21,-19,22,-7);
      ctx.bezierCurveTo(21,8,10,24,0,31);
      ctx.bezierCurveTo(-10,24,-21,8,-22,-7);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Crown drawn as a single clean top layer.
      const crown = ctx.createLinearGradient(0,-20,0,-7);
      crown.addColorStop(0,'#67cf5a');
      crown.addColorStop(1,'#319d4d');
      ctx.fillStyle=crown;
      ctx.strokeStyle=outlineSoft;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-20,-10);
      ctx.lineTo(-10,-18);
      ctx.lineTo(-5,-11);
      ctx.lineTo(0,-21);
      ctx.lineTo(6,-11);
      ctx.lineTo(15,-18);
      ctx.lineTo(20,-9);
      ctx.quadraticCurveTo(0,-4,-20,-10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.fillStyle='#ffe48a';
      for(const [x,y] of [[-9,1],[8,-1],[-4,11],[8,13],[0,22],[-13,12]]){
        ctx.beginPath();
        ctx.ellipse(x,y,1.7,2.4,0,0,Math.PI*2);
        ctx.fill();
      }
      glossySpot(-10,-5,4,6,.45);

    } else if(f.type === 'grapes'){
      // One darker silhouette beneath the grapes avoids the old broken white seams.
      ctx.fillStyle='#6240b8';
      ctx.strokeStyle=outline;
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(-7,-17);
      ctx.bezierCurveTo(-24,-15,-28,3,-21,13);
      ctx.bezierCurveTo(-20,25,-9,35,0,39);
      ctx.bezierCurveTo(9,35,20,25,21,13);
      ctx.bezierCurveTo(28,3,24,-15,7,-17);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      const berries=[[-8,-10],[8,-10],[-17,2],[0,2],[17,2],[-10,15],[10,15],[0,28]];
      for(const [x,y] of berries){
        const g=ctx.createRadialGradient(x-3,y-4,1,x,y,11);
        g.addColorStop(0,'#b28aff');
        g.addColorStop(.5,'#8059dc');
        g.addColorStop(1,'#6842bc');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(x,y,9.5,0,Math.PI*2); ctx.fill();
        glossySpot(x-3,y-4,2.2,3.1,.38);
      }
      leaf(6,-22,12,5,-.3);
      ctx.strokeStyle='#5b432c';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(3,-26);ctx.stroke();

    } else { // watermelon
      // Simple watermelon slice: readable instantly and blissfully non-anatomical.
      ctx.save();

      // Outer rind.
      ctx.fillStyle = '#2d9d55';
      ctx.strokeStyle = outline;
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(-27,10);
      ctx.arc(0,10,27,Math.PI,Math.PI*2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Pale inner rind.
      ctx.fillStyle = '#a8e36f';
      ctx.beginPath();
      ctx.moveTo(-23,9);
      ctx.arc(0,9,23,Math.PI,Math.PI*2);
      ctx.closePath();
      ctx.fill();

      // Red flesh.
      const g = ctx.createLinearGradient(0,-18,0,12);
      g.addColorStop(0,'#ff7380');
      g.addColorStop(1,'#e93654');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20,8);
      ctx.arc(0,8,20,Math.PI,Math.PI*2);
      ctx.closePath();
      ctx.fill();

      // Seeds.
      ctx.fillStyle = '#2b2430';
      for(const [x,y,r] of [[-10,-2,-.18],[0,-7,.08],[10,-2,.18],[-5,4,-.05],[6,3,.12]]){
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(r);
        ctx.beginPath();
        ctx.ellipse(0,0,1.8,3.2,0,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }

      glossySpot(-8,-9,4,5,.35,-.3);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawEgg(e){
    if(!e) return; const pulse=1+Math.sin(e.pulse)*.04; ctx.save();ctx.translate(e.x,e.y);ctx.scale(pulse,pulse);
    let open=Math.min(1,state.eggAnim*2.3);
    ctx.fillStyle='#ffd54f';ctx.strokeStyle='#fff6c6';ctx.lineWidth=4;
    if(open<.35){ ctx.beginPath();ctx.ellipse(0,2,29,39,0,0,Math.PI*2);ctx.fill();ctx.stroke(); }
    else {
      ctx.save();ctx.translate(0,open*-16);ctx.beginPath();ctx.ellipse(0,-12,28,18,0,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
      ctx.save();ctx.translate(0,open*12);ctx.beginPath();ctx.ellipse(0,11,29,25,0,0,Math.PI);ctx.fill();ctx.stroke();ctx.restore();
    }
    ctx.fillStyle='#35b9e8'; for(const [x,y,r] of [[-9,-3,6],[10,7,5],[4,-20,4]]){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
    if(open>.4){ ctx.globalAlpha=open; drawStar(0,0,12,'#ffffff'); }
    ctx.restore();
  }

  function drawStar(x,y,r,color){
    ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2===0?r:r*.45; const px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();
  }

  function drawKairon(){
    const bob=Math.sin(kairon.bob)*(kairon.moving?3.2:1.7);
    const celebrating=kairon.celebrate>0 || state.completed;
    const pose = celebrating ? 'jumping' : ((!running && !state.completed) ? 'waving' : 'walking');
    const frame = kaironFrames[pose];

    ctx.save();
    ctx.translate(kairon.x,kairon.y+bob);

    ctx.fillStyle='rgba(0,0,0,.17)';
    ctx.beginPath(); ctx.ellipse(0,47,34,9,0,0,Math.PI*2); ctx.fill();

    if(kaironSpriteSheet.complete && kaironSpriteSheet.naturalWidth){
      const targetH = celebrating ? 140 : (pose==='waving' ? 142 : 138);
      const targetW = targetH * (frame.sw/frame.sh);
      ctx.save();
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';
      if(kairon.facing<0 && running && !celebrating) ctx.scale(-1,1);
      ctx.drawImage(kaironSpriteSheet,frame.sx,frame.sy,frame.sw,frame.sh,-targetW/2,50-targetH,targetW,targetH);
      ctx.restore();
    } else {
      roundRect(-31,-18,62,54,18,'#f6fbff','#1aa7e1',4);
      drawStar(0,5,12,'#ffd84d');
      roundRect(-37,-61,74,48,19,'#f7fcff','#1aa7e1',4);
      ctx.fillStyle='#173b57';ctx.beginPath();ctx.ellipse(-14,-37,8,10,0,0,Math.PI*2);ctx.ellipse(14,-37,8,10,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#1aa7e1';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-61);ctx.lineTo(0,-75);ctx.stroke();ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(0,-80,7,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawEffects(){
    for(const s of state.sparkles){ ctx.globalAlpha=Math.max(0,s.life/.9); drawStar(s.x,s.y,s.size,'#fff5a8'); }
    ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.font='900 24px system-ui';ctx.fillStyle='white';ctx.strokeStyle='#173b57';ctx.lineWidth=5;
    for(const p of state.popups){ ctx.globalAlpha=Math.max(0,p.life);ctx.strokeText(p.text,p.x,p.y);ctx.fillText(p.text,p.x,p.y); }
    ctx.globalAlpha=1;
  }

  function draw(){ drawBackground(); if(state.fruit) drawFruit(state.fruit); if(state.egg) drawEgg(state.egg); drawKairon(); drawEffects(); }

  function loop(now){
    const dt=Math.min(.04,(now-last)/1000||0);last=now; update(dt); draw(); requestAnimationFrame(loop);
  }

  playBtn.addEventListener('click', startGame);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){paused=true;pauseMusic();saveBest();} else {paused=false;last=performance.now();if(running)playMusic();} });

  async function boot(){
    draw();
    trySdkCall(()=>ytgame.game.firstFrameReady());
    setupYoutubeHooks();
    await loadSave();
    subtitleEl.textContent = state.best > 0
      ? `Help Kairon collect 12 fruits and open 3 magical eggs! Best: ${state.best}`
      : 'Help Kairon collect 12 fruits and open 3 magical eggs!';
    trySdkCall(()=>ytgame.game.gameReady());
    requestAnimationFrame(loop);
  }
  boot();
})();
</script>
</body>
</html>
